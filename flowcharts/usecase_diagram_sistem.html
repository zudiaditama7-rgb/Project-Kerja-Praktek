<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UML Use Case Diagram - Sistem Presensi Siswa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f8fafb; 
            color: #1a1a2e; 
            padding: 40px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; font-weight: 800; color: #065F46; margin-bottom: 8px; }
        .header p { font-size: 14px; color: #555; }
        .diagram-container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 2100px;
            overflow-x: auto;
            display: flex;
            justify-content: center;
        }
        .actions { margin-top: 30px; display: flex; gap: 15px; }
        button {
            padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s;
        }
        .btn-png { background: #065F46; color: white; }
        .btn-png:hover { background: #047857; }
        .btn-jpg { background: #1e40af; color: white; }
        .btn-jpg:hover { background: #1e3a8a; }
        svg text { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>

    <div class="header">
        <h1>UML Use Case Diagram: Sistem Informasi Presensi</h1>
        <p>Interaksi 5 Aktor (Admin, Wali Kelas, Guru Mapel, Guru Pengganti, Kepala Sekolah)</p>
    </div>

    <div class="diagram-container">
        <svg id="uc-diagram" width="2000" height="1900" xmlns="http://www.w3.org/2000/svg">
            <!-- Drawn by JS -->
        </svg>
    </div>

    <div class="actions">
        <button class="btn-png" onclick="downloadImage('png')">⬇ Download PNG</button>
        <button class="btn-jpg" onclick="downloadImage('jpg')">⬇ Download JPG</button>
    </div>

    <script>
        const svg = document.getElementById('uc-diagram');
        const ns = "http://www.w3.org/2000/svg";

        // ===== CONFIG =====
        const RX = 140, RY = 44;
        const UC_FONT = '15';
        const ACTOR_FONT = '18';
        const DEP_FONT = '14';
        const TITLE_FONT = '20';

        // ===== LAYOUT DATA =====
        // Login at TOP (y=180), Logout at BOTTOM (y=1660)
        // All use cases spread with generous spacing (~130px)
        const actors = {
            'admin':     { x: 110,  y: 620,  label: 'Admin',            side: 'left' },
            'wali':      { x: 110,  y: 1250, label: 'Wali Kelas',       side: 'left' },
            'kepsek':    { x: 1890, y: 500,  label: 'Kepala Sekolah',   side: 'right' },
            'mapel':     { x: 1890, y: 1050, label: 'Guru Mapel',       side: 'right' },
            'pengganti': { x: 1890, y: 1400, label: 'Guru Pengganti',   side: 'right' }
        };

        const ucs = {
            // ── LOGIN paling atas ──
            'uc1': { x: 1000, y: 180,  label: 'Melakukan Login' },
            
            // ── Profil di bawah Login ──
            'uc2': { x: 1000, y: 310,  label: 'Mengelola Profil' },
            
            // ── Admin UCs (left-center column) ──
            'uc4':  { x: 600, y: 470,  label: 'Mengelola Data Master' },
            'uc5':  { x: 600, y: 620,  label: 'Mengelola Pengguna' },
            'uc6':  { x: 600, y: 770,  label: 'Memproses Izin Wali Kelas' },
            
            // ── Shared UC (center) ──
            'uc16': { x: 1000, y: 470, label: 'Monitoring Data Presensi' },

            // ── Wali Kelas UCs (left-center column) ──
            'uc7':  { x: 600, y: 970,  label: 'Input Presensi Harian' },
            'uc8':  { x: 600, y: 1150, label: 'Mengajukan Izin & Pengganti' },
            'uc9':  { x: 600, y: 1330, label: 'Mencetak Kartu Siswa QR' },
            'uc10': { x: 600, y: 1500, label: 'Mengajukan Laporan Rekap' },
            
            // ── Include/Extend UCs (center-right column) ──
            'uc11': { x: 1100, y: 770,  label: 'Assign Guru Pengganti' },
            'uc12': { x: 1100, y: 920,  label: 'Presensi via QR Code' },
            'uc13': { x: 1100, y: 1060, label: 'Presensi via Manual' },
            'uc14': { x: 1100, y: 1150, label: 'Upload Surat Bukti' },
            'uc15': { x: 1100, y: 1500, label: 'Download PDF Laporan' },
            
            // ── Kepsek, Mapel, Pengganti UCs (right column) ──
            'uc17': { x: 1450, y: 500,  label: 'Menyetujui Laporan Rekap' },
            'uc18': { x: 1450, y: 1050, label: 'Input Presensi Mapel' },
            'uc19': { x: 1450, y: 1400, label: 'Input Presensi Pengganti' },
            
            // ── LOGOUT paling bawah ──
            'uc3': { x: 1000, y: 1660, label: 'Melakukan Logout' },
        };

        const genericLinks = [];
        ['admin', 'wali', 'kepsek', 'mapel', 'pengganti'].forEach(a => {
            genericLinks.push([a, 'uc1']);
            genericLinks.push([a, 'uc2']);
            genericLinks.push([a, 'uc3']);
        });

        const specificLinks = [
            ['admin', 'uc4'], ['admin', 'uc5'], ['admin', 'uc6'], ['admin', 'uc16'],
            ['wali', 'uc7'], ['wali', 'uc8'], ['wali', 'uc9'], ['wali', 'uc10'],
            ['kepsek', 'uc16'], ['kepsek', 'uc17'],
            ['mapel', 'uc18'],
            ['pengganti', 'uc19']
        ];

        const deps = [
            ['include', 'uc6', 'uc11'],
            ['extend', 'uc12', 'uc7'],
            ['extend', 'uc13', 'uc7'],
            ['include', 'uc8', 'uc14'],
            ['extend', 'uc15', 'uc10']
        ];

        function el(tag, attrs) {
            const e = document.createElementNS(ns, tag);
            for (let k in attrs) e.setAttribute(k, attrs[k]);
            return e;
        }

        function getOvalEdge(cx, cy, rx, ry, angle) {
            const r = (rx * ry) / Math.sqrt(Math.pow(rx * Math.sin(angle), 2) + Math.pow(ry * Math.cos(angle), 2));
            return { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r };
        }

        // ===== 1. BOUNDARY =====
        svg.appendChild(el('rect', {
            x: 300, y: 60, width: 1350, height: 1740, 
            fill: 'transparent', stroke: '#000', 'stroke-width': '2.5'
        }));
        const bTitle = el('text', { x: 320, y: 100, 'font-size': TITLE_FONT, 'font-weight': 'bold', fill: '#000' });
        bTitle.textContent = 'SISTEM INFORMASI PRESENSI SISWA';
        svg.appendChild(bTitle);

        // ===== 2. GENERIC LINKS (all black) =====
        genericLinks.forEach(l => {
            const a = actors[l[0]];
            const u = ucs[l[1]];
            const startX = a.side === 'left' ? a.x + 35 : a.x - 35;
            const angle = Math.atan2(u.y - a.y, u.x - startX);
            const edge = getOvalEdge(u.x, u.y, RX, RY, angle + Math.PI);
            svg.appendChild(el('line', {
                x1: startX, y1: a.y, x2: edge.x, y2: edge.y,
                stroke: '#333', 'stroke-width': '1.5'
            }));
        });

        // ===== 3. SPECIFIC LINKS (black) =====
        specificLinks.forEach(l => {
            const a = actors[l[0]];
            const u = ucs[l[1]];
            const startX = a.side === 'left' ? a.x + 35 : a.x - 35;
            const angle = Math.atan2(u.y - a.y, u.x - startX);
            const edge = getOvalEdge(u.x, u.y, RX, RY, angle + Math.PI);
            svg.appendChild(el('line', {
                x1: startX, y1: a.y, x2: edge.x, y2: edge.y,
                stroke: '#333', 'stroke-width': '1.5'
            }));
        });

        // ===== 4. USE CASES (Ovals) =====
        for (let k in ucs) {
            const u = ucs[k];
            const g = el('g', {});
            g.appendChild(el('ellipse', {
                cx: u.x, cy: u.y, rx: RX, ry: RY,
                fill: '#ffffff', stroke: '#000', 'stroke-width': '2'
            }));
            const t = el('text', {
                x: u.x, y: u.y, 'text-anchor': 'middle', 'dominant-baseline': 'central',
                'font-size': UC_FONT, 'font-weight': '600', fill: '#000'
            });
            t.textContent = u.label;
            g.appendChild(t);
            svg.appendChild(g);
        }

        // ===== 5. DASHED ARROWS (include/extend) =====
        const defs = el('defs', {});
        const marker = el('marker', {
            id: 'arrow', viewBox: '0 0 10 10', refX: '9', refY: '5',
            markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse'
        });
        marker.appendChild(el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: '#333' }));
        defs.appendChild(marker);
        svg.appendChild(defs);

        deps.forEach(d => {
            const type = d[0];
            const from = ucs[d[1]];
            const to = ucs[d[2]];
            
            const dx = to.x - from.x;
            const dy = to.y - from.y;
            const angle = Math.atan2(dy, dx);
            
            const e1 = getOvalEdge(from.x, from.y, RX, RY, angle);
            const e2 = getOvalEdge(to.x, to.y, RX, RY, angle + Math.PI);
            
            const x1 = e1.x + Math.cos(angle) * 3;
            const y1 = e1.y + Math.sin(angle) * 3;
            const x2 = e2.x - Math.cos(angle) * 3;
            const y2 = e2.y - Math.sin(angle) * 3;

            svg.appendChild(el('line', {
                x1: x1, y1: y1, x2: x2, y2: y2,
                stroke: '#333', 'stroke-width': '1.8', 'stroke-dasharray': '8 5',
                'marker-end': 'url(#arrow)'
            }));

            // Label
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2 - 10;
            const bg = el('rect', {
                x: mx - 50, y: my - 14, width: 100, height: 20, fill: 'white'
            });
            svg.appendChild(bg);
            const t = el('text', {
                x: mx, y: my, 'text-anchor': 'middle', 'font-size': DEP_FONT, fill: '#000', 'font-style': 'italic'
            });
            t.textContent = `<<${type}>>`;
            svg.appendChild(t);
        });

        // ===== 6. ACTORS (Stick figures) =====
        for (let k in actors) {
            const a = actors[k];
            const g = el('g', {});
            
            // Head
            g.appendChild(el('circle', { cx: a.x, cy: a.y - 38, r: 18, fill: '#fff', stroke: '#000', 'stroke-width': '2.5' }));
            // Body
            g.appendChild(el('line', { x1: a.x, y1: a.y - 20, x2: a.x, y2: a.y + 28, stroke: '#000', 'stroke-width': '2.5' }));
            // Arms
            g.appendChild(el('line', { x1: a.x - 28, y1: a.y - 2, x2: a.x + 28, y2: a.y - 2, stroke: '#000', 'stroke-width': '2.5' }));
            // Legs
            g.appendChild(el('line', { x1: a.x, y1: a.y + 28, x2: a.x - 22, y2: a.y + 68, stroke: '#000', 'stroke-width': '2.5' }));
            g.appendChild(el('line', { x1: a.x, y1: a.y + 28, x2: a.x + 22, y2: a.y + 68, stroke: '#000', 'stroke-width': '2.5' }));
            
            // Label
            const t = el('text', {
                x: a.x, y: a.y + 95, 'text-anchor': 'middle',
                'font-size': ACTOR_FONT, 'font-weight': 'bold', fill: '#000'
            });
            t.textContent = a.label;
            g.appendChild(t);
            svg.appendChild(g);
        }

        // ===== DOWNLOAD =====
        function downloadImage(format) {
            const scale = 3;
            const width = 2000;
            const height = 1900;
            const headerH = 120;

            const canvas = document.createElement('canvas');
            canvas.width = width * scale;
            canvas.height = (height + headerH) * scale;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.scale(scale, scale);
            ctx.fillStyle = '#065F46';
            ctx.textAlign = 'center';
            ctx.font = 'bold 28px Inter, sans-serif';
            ctx.fillText('UML Use Case Diagram: Sistem Informasi Presensi Siswa', width / 2, 50);
            
            ctx.fillStyle = '#555555';
            ctx.font = '18px Inter, sans-serif';
            ctx.fillText('Interaksi 5 Aktor (Admin, Wali Kelas, Kepala Sekolah, Guru Mapel, Guru Pengganti)', width / 2, 85);
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            const svgData = new XMLSerializer().serializeToString(svg);
            const img = new Image();
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            img.onload = function() {
                ctx.drawImage(img, 0, headerH * scale, width * scale, height * scale);
                URL.revokeObjectURL(url);

                const mime = format === 'jpg' ? 'image/jpeg' : 'image/png';
                const quality = format === 'jpg' ? 0.95 : undefined;
                
                canvas.toBlob(function(outBlob) {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(outBlob);
                    a.download = `usecase_diagram_sistem_presensi.${format}`;
                    a.click();
                    URL.revokeObjectURL(a.href);
                }, mime, quality);
            };
            img.src = url;
        }
    </script>
</body>
</html>
