<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Activity Diagram - Kepala Sekolah Monitoring</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff; padding: 20px; display: flex; justify-content: center; }
  svg { background: #fff; }
  .border { fill: none; stroke: #000; stroke-width: 1.5; }
  .node { fill: #fff; stroke: #000; stroke-width: 1.5; }
  .text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
  .title { font-size: 15px; font-weight: bold; }
  .edge { fill: none; stroke: #000; stroke-width: 1.5; marker-end: url(#arrow); }
</style>
</head>
<body>
<svg viewBox="0 0 600 550" width="600" height="550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  
  <rect x="1" y="1" width="598" height="548" class="border"/>
  <line x1="300" y1="1" x2="300" y2="549" class="border"/>
  <line x1="1" y1="60" x2="599" y2="60" class="border"/>
  <text x="150" y="30" class="text title">Kepala Sekolah</text>
  <text x="450" y="30" class="text title">Sistem</text>
  
  <circle cx="150" cy="100" r="15" fill="#000"/>
  
  <rect x="50" y="155" width="200" height="50" rx="25" class="node"/>
  <text x="150" y="180" class="text">Pilih Menu Dashboard Monitoring</text>
  
  <rect x="350" y="155" width="200" height="50" rx="25" class="node"/>
  <text x="450" y="180" class="text">Ambil Data Presensi Terkini</text>
  
  <rect x="350" y="245" width="200" height="50" rx="25" class="node"/>
  <text x="450" y="270" class="text">Tampil Grafik Statistik (Bar/Pie)</text>
  
  <rect x="50" y="335" width="200" height="50" rx="25" class="node"/>
  <text x="150" y="360" class="text">Evaluasi Tingkat Kehadiran Siswa</text>
  
  <circle cx="150" cy="450" r="15" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="150" cy="450" r="10" fill="#000"/>
  
  <path d="M150,115 L150,155" class="edge"/>
  <path d="M250,180 L350,180" class="edge"/>
  <path d="M450,205 L450,245" class="edge"/>
  <path d="M450,295 L450,315 L150,315 L150,335" class="edge"/>
  <path d="M150,385 L150,435" class="edge"/>
  
</svg>
</body>
</html>
