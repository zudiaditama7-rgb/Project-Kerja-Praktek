<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Flowchart Manual - Presensi Harian</title>
<style>
  body { font-family: 'Times New Roman', Times, serif; background: #fff; padding: 20px; }
  .caption { text-align: center; font-size: 14px; margin-top: 15px; font-weight: bold; }
  svg { display: block; margin: 0 auto; background: #fff; }
  .box { fill: #fff; stroke: #000; stroke-width: 1.5; }
  .box-bold { fill: #fff; stroke: #000; stroke-width: 1.8; }
  .lbl { font-family: 'Times New Roman', Times, serif; text-anchor: middle; dominant-baseline: middle; fill: #000; }
  .lbl-bold { font-weight: bold; }
  .edge { fill: none; stroke: #000; stroke-width: 1.4; marker-end: url(#arrow); }
</style>
</head>
<body>
 
<svg viewBox="0 0 640 550" width="640" height="550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
 
  <ellipse cx="320" cy="40" rx="90" ry="20" class="box"/>
  <text x="320" y="42" class="lbl" font-size="12">Mulai KBM</text>
  <path d="M320,60 L320,96" class="edge"/>
 
  <rect x="140" y="100" width="360" height="35" rx="4" class="box"/>
  <text x="320" y="118" class="lbl" font-size="11">Guru Mengambil Buku Absensi Fisik di Ruang Guru / TU</text>
  <path d="M320,135 L320,176" class="edge"/>
 
  <rect x="140" y="180" width="360" height="35" rx="4" class="box"/>
  <text x="320" y="198" class="lbl" font-size="11">Guru Memanggil Nama Siswa Satu-Persatu di Kelas</text>
  <path d="M320,215 L320,256" class="edge"/>
 
  <rect x="120" y="260" width="400" height="45" rx="4" class="box"/>
  <text x="320" y="276" class="lbl" font-size="11">Guru Mencatat Kehadiran (Hadir/Sakit/Izin/Alpha)</text>
  <text x="320" y="292" class="lbl" font-size="11">Secara Manual dengan Pulpen di Buku Absensi</text>
  <path d="M320,305 L320,346" class="edge"/>
 
  <rect x="140" y="350" width="360" height="35" rx="4" class="box"/>
  <text x="320" y="368" class="lbl" font-size="11">Guru Mengembalikan Buku Absensi ke Ruang Guru</text>
  <path d="M320,385 L320,426" class="edge"/>
 
  <ellipse cx="320" cy="446" rx="90" ry="20" class="box"/>
  <text x="320" y="448" class="lbl" font-size="12">Selesai KBM</text>
</svg>
 
<p class="caption">Flowchart 2: Sistem Manual Presensi Harian</p>
 
</body>
</html>
