<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Flowchart Manual - Rekap Presensi</title>
<style>
  body { font-family: 'Times New Roman', Times, serif; background: #fff; padding: 20px; }
  .caption { text-align: center; font-size: 14px; margin-top: 15px; font-weight: bold; }
  svg { display: block; margin: 0 auto; background: #fff; }
  .box { fill: #fff; stroke: #000; stroke-width: 1.5; }
  .box-bold { fill: #fff; stroke: #000; stroke-width: 1.8; }
  .lbl { font-family: 'Times New Roman', Times, serif; text-anchor: middle; dominant-baseline: middle; fill: #000; }
  .lbl-bold { font-weight: bold; }
  .edge { fill: none; stroke: #000; stroke-width: 1.4; marker-end: url(#arrow); }
</style>
</head>
<body>
 
<svg viewBox="0 0 640 650" width="640" height="650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
 
  <ellipse cx="320" cy="40" rx="90" ry="20" class="box"/>
  <text x="320" y="42" class="lbl" font-size="12">Mulai Akhir Bulan</text>
  <path d="M320,60 L320,96" class="edge"/>
 
  <rect x="120" y="100" width="400" height="35" rx="4" class="box"/>
  <text x="320" y="118" class="lbl" font-size="11">Wali Kelas Menghitung Manual Total Kehadiran Tiap Siswa</text>
  <path d="M320,135 L320,176" class="edge"/>
 
  <rect x="120" y="180" width="400" height="35" rx="4" class="box"/>
  <text x="320" y="198" class="lbl" font-size="11">Wali Kelas Menulis Rekapitulasi di Kertas / Buku Laporan</text>
  <path d="M320,215 L320,256" class="edge"/>
 
  <rect x="140" y="260" width="360" height="35" rx="4" class="box"/>
  <text x="320" y="278" class="lbl" font-size="11">Wali Kelas Menyerahkan Laporan Rekap ke TU</text>
  <path d="M320,295 L320,336" class="edge"/>
 
  <rect x="130" y="340" width="380" height="35" rx="4" class="box"/>
  <text x="320" y="358" class="lbl" font-size="11">TU Mengumpulkan &amp; Mengarsipkan Rekap Seluruh Kelas</text>
  <path d="M320,375 L320,416" class="edge"/>
 
  <rect x="140" y="420" width="360" height="35" rx="4" class="box"/>
  <text x="320" y="438" class="lbl" font-size="11">Kepala Madrasah Menandatangani Buku Laporan Akhir</text>
  <path d="M320,455 L320,496" class="edge"/>
 
  <ellipse cx="320" cy="516" rx="90" ry="20" class="box"/>
  <text x="320" y="518" class="lbl" font-size="12">Selesai</text>
</svg>
 
<p class="caption">Flowchart 3: Sistem Manual Rekapitulasi &amp; Pelaporan Presensi</p>
 
</body>
</html>
