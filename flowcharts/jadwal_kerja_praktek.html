<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Flowchart Jadwal Kerja Praktek</title>
<style>
  body { font-family: 'Times New Roman', Times, serif; background: #fff; padding: 20px; }
  .caption { text-align: center; font-size: 14px; margin-top: 8px; }
  svg { display: block; margin: 0 auto; background: #fff; }
  .box { fill: #fff; stroke: #000; stroke-width: 1.5; }
  .box-bold { fill: #fff; stroke: #000; stroke-width: 1.8; }
  .lbl { font-family: 'Times New Roman', Times, serif; text-anchor: middle; dominant-baseline: middle; fill: #000; }
  .lbl-bold { font-weight: bold; }
  .edge { fill: none; stroke: #000; stroke-width: 1.4; marker-end: url(#arrow2); }
</style>
</head>
<body>
 
<svg viewBox="0 0 520 1080" width="640" height="1330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
 
  <!-- Mulai -->
  <ellipse cx="260" cy="25" rx="95" ry="20" class="box"/>
  <text x="260" y="26" class="lbl" font-size="12">Mulai Kerja Praktek</text>
  <path d="M260,45 L260,68" class="edge"/>
 
  <!-- Bulan 1 -->
  <rect x="185" y="70" width="150" height="30" rx="6" class="box-bold"/>
  <text x="260" y="86" class="lbl lbl-bold" font-size="11.5">Bulan 1: April</text>
  <path d="M260,100 L260,118" class="edge"/>
 
  <rect x="100" y="120" width="320" height="30" rx="4" class="box"/>
  <text x="260" y="136" class="lbl" font-size="10.5">Analisis Sistem &amp; Mulai Menyusun Bab 1-2</text>
  <path d="M260,150 L260,168" class="edge"/>
 
  <!-- Bulan 2 -->
  <rect x="185" y="170" width="150" height="30" rx="6" class="box-bold"/>
  <text x="260" y="186" class="lbl lbl-bold" font-size="11.5">Bulan 2: Mei</text>
  <path d="M260,200 L260,218" class="edge"/>
 
  <rect x="120" y="220" width="280" height="30" rx="4" class="box"/>
  <text x="260" y="236" class="lbl" font-size="10.5">Desain Sistem &amp; Menyusun Bab 3</text>
  <path d="M260,250 L260,268" class="edge"/>
 
  <!-- Bulan 3-4 -->
  <rect x="170" y="270" width="180" height="30" rx="6" class="box-bold"/>
  <text x="260" y="286" class="lbl lbl-bold" font-size="11.5">Bulan 3-4: Juni - Juli</text>
  <path d="M260,300 L260,318" class="edge"/>
 
  <rect x="90" y="320" width="340" height="30" rx="4" class="box"/>
  <text x="260" y="336" class="lbl" font-size="10.5">Pengkodean / Coding Sistem Laravel &amp; MySQL</text>
  <path d="M260,350 L260,368" class="edge"/>
 
  <!-- Bulan 5 -->
  <rect x="185" y="370" width="150" height="30" rx="6" class="box-bold"/>
  <text x="260" y="386" class="lbl lbl-bold" font-size="11.5">Bulan 5: Agustus</text>
  <path d="M260,400 L260,418" class="edge"/>
 
  <rect x="110" y="420" width="300" height="30" rx="4" class="box"/>
  <text x="260" y="436" class="lbl" font-size="10.5">Pengujian Sistem</text>
  <path d="M260,450 L260,478" class="edge"/>
 
  <!-- Diamond -->
  <polygon points="260,480 380,570 260,660 140,570" class="box"/>
  <text x="260" y="562" class="lbl" font-size="10.5">Apakah Sistem</text>
  <text x="260" y="578" class="lbl" font-size="10.5">Lolos Uji?</text>
 
  <!-- loop back to pengkodean -->
  <path d="M380,570 L440,570 L440,335 L430,335" class="edge"/>
  <text x="445" y="450" class="lbl" font-size="9.5" text-anchor="start">Tidak / Ada Bug</text>
 
  <!-- Ya -> Bulan 6-7 -->
  <path d="M260,660 L260,718" class="edge"/>
  <text x="270" y="690" class="lbl" font-size="9.5" text-anchor="start">Ya / Stabil</text>
 
  <rect x="150" y="720" width="220" height="30" rx="6" class="box-bold"/>
  <text x="260" y="736" class="lbl lbl-bold" font-size="11.5">Bulan 6-7: September - Oktober</text>
 
  <!-- two branches -->
  <path d="M260,750 L260,765 L140,765 L140,782" class="edge"/>
  <path d="M260,750 L260,765 L380,765 L380,782" class="edge"/>
 
  <rect x="40" y="784" width="200" height="48" rx="4" class="box"/>
  <text x="140" y="800" class="lbl" font-size="9.5">Perawatan Sistem: Korektif,</text>
  <text x="140" y="816" class="lbl" font-size="9.5">Preventif, Adaptif, Backup</text>
 
  <rect x="280" y="784" width="200" height="48" rx="4" class="box"/>
  <text x="380" y="800" class="lbl" font-size="9.5">Finalisasi Laporan &amp;</text>
  <text x="380" y="816" class="lbl" font-size="9.5">Bimbingan Bab Terakhir</text>
 
  <!-- converge -->
  <path d="M140,832 L140,848 L260,848 L260,864" class="edge"/>
  <path d="M380,832 L380,848 L260,848 L260,864" class="edge"/>
 
  <rect x="185" y="866" width="150" height="30" rx="6" class="box-bold"/>
  <text x="260" y="882" class="lbl lbl-bold" font-size="11.5">Akhir Oktober</text>
  <path d="M260,896 L260,920" class="edge"/>
 
  <ellipse cx="260" cy="942" rx="115" ry="22" class="box"/>
  <text x="260" y="943" class="lbl" font-size="11">Selesai / Siap Sidang KP</text>
</svg>
 
<p class="caption">Gambar 3. 10 Flowchart Jadwal Kerja Praktek</p>
 
</body>
</html>
