<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Flowchart Tahapan Kerja Praktek</title>
<style>
  body { font-family: 'Times New Roman', Times, serif; background: #fff; padding: 20px; }
  .caption { text-align: center; font-size: 14px; margin-top: 8px; }
  svg { display: block; margin: 0 auto; background: #fff; }
  .box { fill: #fff; stroke: #000; stroke-width: 1.5; }
  .box-bold { fill: #fff; stroke: #000; stroke-width: 1.8; }
  .lbl { font-family: 'Times New Roman', Times, serif; text-anchor: middle; dominant-baseline: middle; fill: #000; }
  .lbl-bold { font-weight: bold; }
  .edge { fill: none; stroke: #000; stroke-width: 1.4; marker-end: url(#arrow); }
</style>
</head>
<body>
 
<svg viewBox="0 0 500 1050" width="620" height="1300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
 
  <!-- Mulai -->
  <ellipse cx="250" cy="25" rx="90" ry="20" class="box"/>
  <text x="250" y="26" class="lbl" font-size="12">Mulai Kerja Praktek</text>
  <path d="M250,45 L250,68" class="edge"/>
 
  <!-- 1. Analisis Sistem -->
  <rect x="170" y="70" width="160" height="30" rx="6" class="box-bold"/>
  <text x="250" y="86" class="lbl lbl-bold" font-size="12">1. Analisis Sistem</text>
  <path d="M250,100 L250,118" class="edge"/>
 
  <rect x="105" y="120" width="290" height="38" rx="4" class="box"/>
  <text x="250" y="132" class="lbl" font-size="10">Identifikasi Masalah &amp; Kebutuhan Fitur</text>
  <text x="250" y="146" class="lbl" font-size="10">QR Code + Input Manual</text>
  <path d="M250,158 L250,176" class="edge"/>
 
  <!-- 2. Desain Sistem -->
  <rect x="170" y="178" width="160" height="30" rx="6" class="box-bold"/>
  <text x="250" y="194" class="lbl lbl-bold" font-size="12">2. Desain Sistem</text>
  <path d="M250,208 L250,226" class="edge"/>
 
  <rect x="105" y="228" width="290" height="30" rx="4" class="box"/>
  <text x="250" y="244" class="lbl" font-size="10">Desain UI, Database MySQL &amp; Alur Presensi</text>
  <path d="M250,258 L250,276" class="edge"/>
 
  <!-- 3. Pengkodean -->
  <rect x="160" y="278" width="180" height="30" rx="6" class="box-bold"/>
  <text x="250" y="294" class="lbl lbl-bold" font-size="12">3. Pengkodean / Coding</text>
  <path d="M250,308 L250,326" class="edge"/>
 
  <rect x="105" y="328" width="290" height="30" rx="4" class="box"/>
  <text x="250" y="344" class="lbl" font-size="10">Implementasi Framework Laravel &amp; MySQL</text>
  <path d="M250,358 L250,376" class="edge"/>
 
  <!-- 4. Pengujian Sistem -->
  <rect x="170" y="378" width="160" height="30" rx="6" class="box-bold"/>
  <text x="250" y="394" class="lbl lbl-bold" font-size="12">4. Pengujian Sistem</text>
  <path d="M250,408 L250,438" class="edge"/>
 
  <!-- Diamond -->
  <polygon points="250,440 400,530 250,620 100,530" class="box"/>
  <text x="250" y="522" class="lbl" font-size="10.5">Uji Fungsional Sistem:</text>
  <text x="250" y="538" class="lbl" font-size="10.5">Scan QR &amp; Input Manual?</text>
 
  <!-- loop back to pengkodean -->
  <path d="M400,530 L455,530 L455,293 L340,293" class="edge"/>
  <text x="460" y="415" class="lbl" font-size="9.5" text-anchor="start">Ada Error / Bug</text>
 
  <!-- Berhasil -> 5. Perawatan Sistem -->
  <path d="M250,620 L250,648" class="edge"/>
  <text x="258" y="636" class="lbl" font-size="9.5" text-anchor="start">Berhasil / Sesuai</text>
 
  <rect x="170" y="650" width="160" height="30" rx="6" class="box-bold"/>
  <text x="250" y="666" class="lbl lbl-bold" font-size="12">5. Perawatan Sistem</text>
  <path d="M250,680 L250,698" class="edge"/>
 
  <rect x="90" y="700" width="320" height="30" rx="4" class="box"/>
  <text x="250" y="716" class="lbl" font-size="10">Korektif, Preventif, Adaptif &amp; Backup Data</text>
  <path d="M250,730 L250,748" class="edge"/>
 
  <!-- 6. Penyusunan Laporan -->
  <rect x="160" y="750" width="180" height="30" rx="6" class="box-bold"/>
  <text x="250" y="766" class="lbl lbl-bold" font-size="12">6. Penyusunan Laporan</text>
 
  <!-- three branches -->
  <path d="M250,780 L250,795 L110,795 L110,812" class="edge"/>
  <path d="M250,780 L250,812" class="edge"/>
  <path d="M250,780 L250,795 L390,795 L390,812" class="edge"/>
 
  <rect x="20" y="814" width="180" height="40" rx="4" class="box"/>
  <text x="110" y="828" class="lbl" font-size="9.5">Dokumentasi &amp;</text>
  <text x="110" y="842" class="lbl" font-size="9.5">Penyusunan Naskah</text>
 
  <rect x="200" y="814" width="100" height="40" rx="4" class="box"/>
  <text x="250" y="838" class="lbl" font-size="9.5">Bimbingan &amp; Revisi</text>
 
  <rect x="300" y="814" width="180" height="40" rx="4" class="box"/>
  <text x="390" y="838" class="lbl" font-size="9.5">Finalisasi Laporan KP</text>
 
  <!-- converge to Selesai -->
  <path d="M110,854 L110,870 L250,870 L250,888" class="edge"/>
  <path d="M250,854 L250,888" class="edge"/>
  <path d="M390,854 L390,870 L250,870 L250,888" class="edge"/>
 
  <ellipse cx="250" cy="905" rx="70" ry="20" class="box"/>
  <text x="250" y="906" class="lbl" font-size="12">Selesai</text>
</svg>
 
<p class="caption">Gambar 3. 9 Tahapan Kerja Praktek</p>
 
</body>
</html>
