<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Flowchart Sistem Usulan - Rekap Presensi</title>
<style>
  body { font-family: 'Times New Roman', Times, serif; background: #fff; padding: 20px; }
  .caption { text-align: center; font-size: 14px; margin-top: 15px; font-weight: bold; }
  svg { display: block; margin: 0 auto; background: #fff; }
  .box { fill: #fff; stroke: #000; stroke-width: 1.5; }
  .box-bold { fill: #fff; stroke: #000; stroke-width: 1.8; }
  .lbl { font-family: 'Times New Roman', Times, serif; text-anchor: middle; dominant-baseline: middle; fill: #000; }
  .lbl-bold { font-weight: bold; }
  .edge { fill: none; stroke: #000; stroke-width: 1.4; marker-end: url(#arrow); }
</style>
</head>
<body>
 
<svg viewBox="0 0 640 550" width="640" height="550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
 
  <ellipse cx="320" cy="40" rx="90" ry="20" class="box"/>
  <text x="320" y="42" class="lbl" font-size="12">Mulai Pelaporan</text>
  <path d="M320,60 L320,96" class="edge"/>
 
  <rect x="120" y="100" width="400" height="35" rx="4" class="box"/>
  <text x="320" y="118" class="lbl" font-size="11">User (Admin/Kepsek/Wali Kelas) Membuka Menu Rekapitulasi</text>
  <path d="M320,135 L320,176" class="edge"/>
 
  <rect x="170" y="180" width="300" height="35" rx="4" class="box"/>
  <text x="320" y="198" class="lbl" font-size="11">Memilih Filter Data (Bulan, Tahun Ajaran, Kelas)</text>
  <path d="M320,215 L320,256" class="edge"/>
 
  <rect x="140" y="260" width="360" height="35" rx="4" class="box"/>
  <text x="320" y="278" class="lbl" font-size="11">Sistem Menghitung Total Kehadiran dari Database Otomatis</text>
  <path d="M320,295 L320,336" class="edge"/>
 
  <rect x="130" y="340" width="380" height="45" rx="4" class="box"/>
  <text x="320" y="356" class="lbl" font-size="11">Sistem Menampilkan Hasil Rekap di Layar</text>
  <text x="320" y="372" class="lbl" font-size="11">&amp; Men-generate File Laporan (Format Cetak / PDF / Excel)</text>
  <path d="M320,385 L320,426" class="edge"/>
 
  <ellipse cx="320" cy="446" rx="90" ry="20" class="box"/>
  <text x="320" y="448" class="lbl" font-size="12">Selesai</text>
</svg>
 
<p class="caption">Flowchart 3: Sistem Usulan (Terkomputerisasi) - Rekapitulasi &amp; Pelaporan</p>
 
</body>
</html>
