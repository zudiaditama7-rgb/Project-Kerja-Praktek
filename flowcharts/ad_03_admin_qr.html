<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Activity Diagram - Admin Membuat QR</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff; padding: 20px; display: flex; justify-content: center; }
  svg { background: #fff; }
  .border { fill: none; stroke: #000; stroke-width: 1.5; }
  .node { fill: #fff; stroke: #000; stroke-width: 1.5; }
  .text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
  .title { font-size: 15px; font-weight: bold; }
  .edge { fill: none; stroke: #000; stroke-width: 1.5; marker-end: url(#arrow); }
</style>
</head>
<body>
<svg viewBox="0 0 600 600" width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  
  <rect x="1" y="1" width="598" height="598" class="border"/>
  <line x1="300" y1="1" x2="300" y2="599" class="border"/>
  <line x1="1" y1="60" x2="599" y2="60" class="border"/>
  <text x="150" y="30" class="text title">Admin</text>
  <text x="450" y="30" class="text title">Sistem</text>
  
  <circle cx="150" cy="100" r="15" fill="#000"/>
  
  <rect x="50" y="155" width="200" height="50" rx="25" class="node"/>
  <text x="150" y="180" class="text">Pilih Menu Data Siswa</text>
  
  <rect x="350" y="155" width="200" height="50" rx="25" class="node"/>
  <text x="450" y="180" class="text">Tampil Daftar Siswa</text>
  
  <rect x="50" y="245" width="200" height="50" rx="25" class="node"/>
  <text x="150" y="270" class="text">Klik "Generate QR Code"</text>
  
  <rect x="350" y="245" width="200" height="50" rx="25" class="node"/>
  <text x="450" y="270" class="text">Proses Pembuatan QR</text>
  
  <rect x="350" y="335" width="200" height="50" rx="25" class="node"/>
  <text x="450" y="360" class="text">Simpan Gambar &amp; Sukses</text>
  
  <rect x="50" y="425" width="200" height="50" rx="25" class="node"/>
  <text x="150" y="450" class="text">Cetak / Download Kartu QR</text>
  
  <circle cx="150" cy="540" r="15" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="150" cy="540" r="10" fill="#000"/>
  
  <path d="M150,115 L150,155" class="edge"/>
  <path d="M250,180 L350,180" class="edge"/>
  <path d="M450,205 L450,225 L150,225 L150,245" class="edge"/>
  <path d="M250,270 L350,270" class="edge"/>
  <path d="M450,295 L450,335" class="edge"/>
  <path d="M450,385 L450,405 L150,405 L150,425" class="edge"/>
  <path d="M150,475 L150,525" class="edge"/>
  
</svg>
</body>
</html>
